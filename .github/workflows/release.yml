name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build arm64 macOS app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: swift version
        run: swift --version

      - name: cache SwiftPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: build
        run: swift build -c release --arch arm64

      - name: test
        run: swift test -c release --arch arm64

      - name: stage
        run: |
          BIN=.build/arm64-apple-macosx/release/parrot
          file "$BIN"
          mkdir -p dist
          cp "$BIN" dist/parrot
          cp scripts/install.sh dist/install.sh
          chmod +x dist/install.sh
          APP_VERSION=$(dist/parrot --version)
          BUNDLE_VERSION=$(plutil -extract CFBundleShortVersionString raw AppBundle/Info.plist)
          test "$APP_VERSION" = "$BUNDLE_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$APP_VERSION" = "${GITHUB_REF_NAME#v}"
          fi

      - name: strip
        run: strip -x dist/parrot

      - name: build signed app bundle
        run: |
          mkdir -p dist/Parrot.app/Contents/MacOS
          cp AppBundle/Info.plist dist/Parrot.app/Contents/Info.plist
          cp dist/parrot dist/Parrot.app/Contents/MacOS/parrot
          chmod +x dist/Parrot.app/Contents/MacOS/parrot
          codesign --force --deep --sign - \
            --identifier com.digimata.parrot \
            --requirements '=designated => identifier "com.digimata.parrot"' \
            dist/Parrot.app
          codesign --verify --deep --strict --verbose=2 dist/Parrot.app
          codesign -d --requirements - dist/Parrot.app 2>&1 | grep 'identifier "com.digimata.parrot"'

      - name: package
        run: |
          cd dist
          tar -czf parrot-macos-arm64.tar.gz parrot Parrot.app
          shasum -a 256 parrot-macos-arm64.tar.gz > parrot-macos-arm64.tar.gz.sha256
          shasum -a 256 install.sh > install.sh.sha256
          ls -lh

      - name: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/install.sh
            dist/install.sh.sha256
            dist/parrot-macos-arm64.tar.gz
            dist/parrot-macos-arm64.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
